on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub Actions runner label"
        type: string
        default: "ubuntu-latest"
        required: false
      push:
        description: "Push image to registry after successful build and scan"
        type: boolean
        default: true
        required: false
      smoke_test:
        description: "Shell commands to run as a smoke test against the built image. The image ref is available as $IMAGE. Leave empty to skip."
        type: string
        default: ""
        required: false
      smoke_test_timeout:
        description: "Timeout in minutes for the smoke test step"
        type: number
        default: 5
        required: false
      no_cache_filter:
        description: "Comma-separated list of Dockerfile stage names to always rebuild (skip cache). Useful for stages with apk upgrade or similar package manager commands."
        type: string
        default: ""
        required: false
      build_args:
        description: "Newline-separated list of build args (KEY=VALUE) passed to docker build"
        type: string
        default: ""
        required: false
      keep_tagged:
        description: "Number of most recent tagged image versions to keep after a push; older versions and untagged manifests are deleted. The calling repo needs the Admin role on the package. 0 disables pruning."
        type: number
        default: 3
        required: false
    secrets:
      GHCR_TOKEN:
        description: "The token to authenticate against GHCR"
        required: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-publish:
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=schedule,pattern=daily-{{date 'YYYYMMDD'}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build_args }}
          secrets: |
            github_token=${{ secrets.GHCR_TOKEN }}
          no-cache-filters: ${{ inputs.no_cache_filter }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      - name: Scan image with Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/${{ github.repository }}:latest
          output-format: table
          fail-build: true
          severity-cutoff: low
          only-fixed: true

      - name: Generate Grype SARIF report
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        if: always()
        id: grype-sarif
        with:
          image: ghcr.io/${{ github.repository }}:latest
          output-format: sarif
          fail-build: false
          severity-cutoff: low

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype-sarif.outputs.sarif }}

      - name: Smoke test
        if: inputs.smoke_test != ''
        timeout-minutes: ${{ fromJSON(inputs.smoke_test_timeout) }}
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: ${{ inputs.smoke_test }}

      - name: Smoke test container logs
        if: failure() && inputs.smoke_test != ''
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          for cid in $(docker ps -aq --filter "ancestor=$IMAGE"); do
            echo "::group::Logs from container $cid"
            docker logs "$cid" 2>&1 || true
            echo "::endgroup::"
            docker rm -f "$cid" > /dev/null 2>&1 || true
          done

      - name: Push Docker image
        if: inputs.push && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '); do
            docker push "$tag"
          done

      - name: Prune old image versions
        if: inputs.push && inputs.keep_tagged > 0 && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GHCR_TOKEN }}
          keep-n-tagged: ${{ inputs.keep_tagged }}
          exclude-tags: buildcache
          delete-untagged: true
          validate: true
